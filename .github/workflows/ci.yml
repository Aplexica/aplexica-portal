name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-lint-test:
    # Private repo → org self-hosted fleet (free); public or scheduled → GitHub-hosted
    # (free for public repos, disposable isolation for fork PRs). Backstop: the org
    # runner group refuses public-repo jobs even if a fork edits this expression.
    runs-on: ${{ (github.event_name == 'schedule' || github.event.repository.visibility == 'public') && 'ubuntu-latest' || 'aplexica-linux' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.job }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22.23.1 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  build:
    # Private repo → org self-hosted fleet (free); public or scheduled → GitHub-hosted
    # (free for public repos, disposable isolation for fork PRs). Backstop: the org
    # runner group refuses public-repo jobs even if a fork edits this expression.
    runs-on: ${{ (github.event_name == 'schedule' || github.event.repository.visibility == 'public') && 'ubuntu-latest' || 'aplexica-linux' }}
    needs: typecheck-lint-test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.job }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22.23.1 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:local
      - run: pnpm legal:check
      - run: pnpm legal:self-test
      - run: pnpm headers:check
      - run: pnpm headers:self-test
      - run: pnpm release:self-test
      - run: pnpm bundle-check

  e2e-local:
    # Private repo → org self-hosted fleet (free); public or scheduled → GitHub-hosted
    # (free for public repos, disposable isolation for fork PRs). Backstop: the org
    # runner group refuses public-repo jobs even if a fork edits this expression.
    runs-on: ${{ (github.event_name == 'schedule' || github.event.repository.visibility == 'public') && 'ubuntu-latest' || 'aplexica-linux' }}
    needs: build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.job }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22.23.1 }
      - run: pnpm install --frozen-lockfile
      # Install the browser revision matching the locked Playwright package.
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e:local
