name: Release local portal

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Private repo → org self-hosted fleet (free); public or scheduled → GitHub-hosted
    # (free for public repos, disposable isolation for fork PRs). Backstop: the org
    # runner group refuses public-repo jobs even if a fork edits this expression.
    runs-on: ${{ (github.event_name == 'schedule' || github.event.repository.visibility == 'public') && 'ubuntu-latest' || 'aplexica-linux' }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      LC_ALL: C
      TAG: ${{ github.ref_name }}
    steps:
      - name: Initialize release paths
        run: |
          printf 'RELEASE_SOURCE=%s\n' "$RUNNER_TEMP/release-source" >> "$GITHUB_ENV"
          printf 'ARTIFACTS=%s\n' "$RUNNER_TEMP/release-artifacts" >> "$GITHUB_ENV"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          ref: ${{ github.sha }}

      # Must precede the tag validation below: that step's identity cross-check
      # runs `node tools/local-release.mjs identity`.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1

      - name: Validate protected annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$TAG is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          tag_ref="refs/tags/$TAG"
          if [ "$(git cat-file -t "$tag_ref")" != tag ]; then
            echo "::error::$TAG must be an annotated tag"
            exit 1
          fi
          tag_object="$(git rev-parse "$tag_ref")"
          source_commit="$(git rev-parse "$tag_ref^{commit}")"
          # `persist-credentials: false` leaves git without a credential for this
          # private repository, so read the remote tag identity over the
          # authenticated API. The bearer never reaches curl's argv.
          hdr="$RUNNER_TEMP/gh-auth.header"
          umask 077
          printf 'Authorization: Bearer %s\n' "$GH_TOKEN" > "$hdr"
          trap 'rm -f "$hdr"' EXIT INT TERM HUP
          api() {
            curl --fail --silent --show-error \
              -H @"$hdr" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$1"
          }
          ref_json="$(api "git/ref/tags/$TAG")"
          if [ "$(printf '%s' "$ref_json" | jq -er '.object.type')" != tag ]; then
            echo "::error::$TAG is not an annotated tag on origin"
            exit 1
          fi
          remote_tag_object="$(printf '%s' "$ref_json" | jq -er '.object.sha')"
          remote_peeled_commit="$(api "git/tags/$remote_tag_object" | jq -er '.object.sha')"
          node tools/local-release.mjs identity \
            --tag "$TAG" \
            --event-sha "$GITHUB_SHA" \
            --tag-object "$tag_object" \
            --peeled-commit "$source_commit" \
            --remote-tag-object "$remote_tag_object" \
            --remote-peeled-commit "$remote_peeled_commit"
          if ! git merge-base --is-ancestor "$source_commit" refs/remotes/origin/main; then
            echo "::error::$TAG must point to a commit on origin/main"
            exit 1
          fi
          if git ls-tree -r "$source_commit" | awk '$1 !~ /^100/ { bad=1 } END { exit !bad }'; then
            echo "::error::release source contains a symlink, submodule, or special entry"
            exit 1
          fi
          printf 'TAG_OBJECT=%s\n' "$tag_object" >> "$GITHUB_ENV"
          printf 'SOURCE_COMMIT=%s\n' "$source_commit" >> "$GITHUB_ENV"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git log -1 --format=%ct "$source_commit")" >> "$GITHUB_ENV"

      - name: Extract exact tag to a history-free source directory
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_SOURCE"
          git archive --format=tar "refs/tags/$TAG^{commit}" | tar -xf - -C "$RELEASE_SOURCE"
          test ! -e "$RELEASE_SOURCE/.git"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.job }}

      - name: Install exact locked dependencies
        run: cd "$RELEASE_SOURCE" && pnpm install --frozen-lockfile
      - name: Typecheck
        run: cd "$RELEASE_SOURCE" && pnpm typecheck
      - name: Lint
        run: cd "$RELEASE_SOURCE" && pnpm lint
      - name: Unit tests
        run: cd "$RELEASE_SOURCE" && pnpm test
      - name: Install matching browser
        run: cd "$RELEASE_SOURCE" && pnpm exec playwright install chromium
      - name: Local browser tests
        run: cd "$RELEASE_SOURCE" && env CI=1 pnpm test:e2e:local
      - name: Build local portal
        run: cd "$RELEASE_SOURCE" && pnpm build:local
      - name: Verify legal artifacts
        run: cd "$RELEASE_SOURCE" && pnpm legal:check
      - name: Exercise legal negative controls
        run: cd "$RELEASE_SOURCE" && pnpm legal:self-test
      - name: Verify daemon response-header contract
        run: cd "$RELEASE_SOURCE" && pnpm headers:check
      - name: Exercise response-header negative controls
        run: cd "$RELEASE_SOURCE" && pnpm headers:self-test
      - name: Verify bundle policy and budgets
        run: cd "$RELEASE_SOURCE" && pnpm bundle-check
      - name: Verify workflow policy
        run: cd "$RELEASE_SOURCE" && node tools/actionpin.mjs
      - name: Exercise release negative controls
        run: cd "$RELEASE_SOURCE" && pnpm release:self-test
      - name: Audit production dependencies
        run: cd "$RELEASE_SOURCE" && pnpm audit --prod --audit-level high

      - name: Package reproducible local and source archives
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACTS"
          local_asset="$ARTIFACTS/aplexica-portal-${TAG}-local.tar.gz"
          source_asset="$ARTIFACTS/aplexica-portal-${TAG}-source.tar.gz"
          tar --sort=name --format=gnu --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            --mode='u+rwX,go+rX,go-w' --no-acls --no-xattrs --no-selinux \
            --use-compress-program='gzip -9 -n' \
            -C "$RELEASE_SOURCE" -cf "$local_asset" dist-local
          source_stage="$RUNNER_TEMP/aplexica-portal-${TAG}"
          test ! -e "$source_stage"
          mkdir -p "$source_stage"
          git archive --format=tar "refs/tags/$TAG^{commit}" \
            | tar --no-same-owner --no-same-permissions -xf - -C "$source_stage"
          tar --sort=name --format=gnu --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            --mode='u+rwX,go+rX,go-w' --no-acls --no-xattrs --no-selinux \
            --use-compress-program='gzip -9 -n' \
            -C "$RUNNER_TEMP" -cf "$source_asset" "aplexica-portal-${TAG}"

          tar --sort=name --format=gnu --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            --mode='u+rwX,go+rX,go-w' --no-acls --no-xattrs --no-selinux \
            --use-compress-program='gzip -9 -n' \
            -C "$RELEASE_SOURCE" -cf "$local_asset.repro" dist-local
          cmp "$local_asset" "$local_asset.repro"
          rm "$local_asset.repro"

          tar --sort=name --format=gnu --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            --mode='u+rwX,go+rX,go-w' --no-acls --no-xattrs --no-selinux \
            --use-compress-program='gzip -9 -n' \
            -C "$RUNNER_TEMP" -cf "$source_asset.repro" "aplexica-portal-${TAG}"
          cmp "$source_asset" "$source_asset.repro"
          rm "$source_asset.repro"

          members="$(tar -tzf "$local_asset")"
          grep -Eq '^dist-local/index-local\.html$' <<< "$members"
          grep -Eq '^dist-local/assets/.+\.js$' <<< "$members"
          grep -Eq '^dist-local/legal/LICENSE$' <<< "$members"
          grep -Eq '^dist-local/legal/NOTICE$' <<< "$members"
          grep -Eq '^dist-local/legal/THIRD_PARTY_NOTICES\.txt$' <<< "$members"
          if tar -tvzf "$local_asset" | awk '$1 !~ /^[-d]/ { bad=1 } END { exit !bad }'; then
            echo "::error::local archive contains a symlink or special member"
            exit 1
          fi
          node "$RELEASE_SOURCE/tools/local-release.mjs" archive-check \
            --archive "$local_asset" --expected-root dist-local --expected-epoch "$SOURCE_DATE_EPOCH"
          node "$RELEASE_SOURCE/tools/local-release.mjs" archive-check \
            --archive "$source_asset" --expected-root "aplexica-portal-${TAG}" --expected-epoch "$SOURCE_DATE_EPOCH"

      - name: Generate deterministic SBOM and provenance
        run: |
          set -euo pipefail
          cd "$RELEASE_SOURCE"
          node tools/local-release.mjs metadata \
            --tag "$TAG" \
            --commit "$SOURCE_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --server-url "$GITHUB_SERVER_URL" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --event-sha "$GITHUB_SHA" \
            --tag-object "$TAG_OBJECT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --epoch "$SOURCE_DATE_EPOCH" \
            --bundle "$ARTIFACTS/aplexica-portal-${TAG}-local.tar.gz" \
            --source "$ARTIFACTS/aplexica-portal-${TAG}-source.tar.gz" \
            --legal-manifest "$RELEASE_SOURCE/dist-local/legal/manifest.json" \
            --out-dir "$ARTIFACTS"

      - name: Hash every release payload
        working-directory: ${{ env.ARTIFACTS }}
        run: |
          set -euo pipefail
          sha256sum \
            "aplexica-portal-${TAG}-local.tar.gz" \
            "aplexica-portal-${TAG}-source.tar.gz" \
            "aplexica-portal-${TAG}.spdx.json" \
            "aplexica-portal-${TAG}.intoto.jsonl" \
            > SHA256SUMS
          sha256sum --check SHA256SUMS

      # The self-hosted runner image ships no `envsubst`; sigstore/cosign-installer
      # expands its default install-dir ($HOME/.cosign) with it and exits 127 without it.
      - name: Install envsubst for the cosign installer
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v envsubst >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gettext-base
          fi
          command -v envsubst
          envsubst --version >/dev/null

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - name: Sign and verify the checksum root
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "$ARTIFACTS/SHA256SUMS.sigstore.json" \
            "$ARTIFACTS/SHA256SUMS"
          cosign verify-blob \
            --bundle "$ARTIFACTS/SHA256SUMS.sigstore.json" \
            --certificate-identity "https://github.com/Aplexica/aplexica-portal/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$ARTIFACTS/SHA256SUMS"

      # The self-hosted runner image ships no `gh`. Put a pinned, digest-verified
      # copy on PATH so the publish step below runs unmodified.
      - name: Bootstrap pinned GitHub CLI
        run: |
          set -euo pipefail
          gh_version=2.98.0
          gh_asset="gh_${gh_version}_linux_amd64.tar.gz"
          gh_sha256=3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de
          gh_root="$RUNNER_TEMP/gh"
          gh_stage="$RUNNER_TEMP/gh-download"
          rm -rf "$gh_root" "$gh_stage"
          mkdir -p "$gh_root" "$gh_stage"
          curl --fail --silent --show-error --location \
            --output "$gh_stage/gh.tar.gz" \
            "https://github.com/cli/cli/releases/download/v${gh_version}/${gh_asset}"
          printf '%s  gh.tar.gz\n' "$gh_sha256" > "$gh_stage/gh.sha256"
          ( cd "$gh_stage" && sha256sum --check gh.sha256 )
          tar -xf "$gh_stage/gh.tar.gz" -C "$gh_root" --strip-components=1
          test -x "$gh_root/bin/gh"
          echo "$gh_root/bin" >> "$GITHUB_PATH"
          "$gh_root/bin/gh" --version

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag \
            "$ARTIFACTS/aplexica-portal-${TAG}-local.tar.gz" \
            "$ARTIFACTS/aplexica-portal-${TAG}-source.tar.gz" \
            "$ARTIFACTS/aplexica-portal-${TAG}.spdx.json" \
            "$ARTIFACTS/aplexica-portal-${TAG}.intoto.jsonl" \
            "$ARTIFACTS/SHA256SUMS" \
            "$ARTIFACTS/SHA256SUMS.sigstore.json"
